# ============================================================================
# kalshi-copilot — runtime configuration
#
# Bind-mounted read-only into every container.  Most values are editable from
# the settings UI (which writes through to config_kv in Postgres and takes
# precedence over this file); this file is the boot-time default.
#
# NOTHING here can enable automatic trading.  Every order requires explicit
# per-trade human approval.  There is no auto-trade flag, by design.
# ============================================================================

# ---------------------------------------------------------------------------
# Trading mode
# ---------------------------------------------------------------------------
trading:
  # paper | live
  #   paper : proposals execute against the demo environment / fill simulator
  #   live  : real orders — ALSO requires KALSHI_ENV=prod, LIVE_TRADING=true
  #           in .env, and per-trade confirmation in the UI.
  mode: paper

  # Proposals expire if not approved within this window (seconds).
  default_proposal_ttl_sec: 120

  # In paper mode, send approved orders to the *demo* exchange when demo
  # credentials exist. Demo is play money, so this exercises the real order
  # rail — signing, rate limits, partial fills — at no risk. Set false to fill
  # against the local simulator instead.
  #
  # This can never route to production. Paper mode refuses to touch a prod
  # exchange even if KALSHI_ENV=prod, so changing the environment for a data
  # reason cannot quietly arm real money.
  paper_uses_demo_exchange: true

  # Order placed on approval.
  order:
    # gtc | ioc
    time_in_force: gtc
    # Cancel an unfilled (or partially filled) order after this many seconds.
    auto_cancel_after_sec: 90
    # Never pay worse than the proposed price.
    allow_price_improvement_only: true

# ---------------------------------------------------------------------------
# Risk & sizing  (M7)
# ---------------------------------------------------------------------------
risk:
  bankroll_usd: 1000.0
  # Hard ceiling on proposals awaiting a decision. The safety model is a
  # human reading each one; a detector scanning every 20s can fill a queue
  # faster than anyone reads it, and a queue that long is rubber-stamped
  # rather than reviewed. Approval fatigue is a failure no test catches.
  max_pending_proposals: 10
  kelly_fraction: 0.25          # quarter-Kelly
  max_pct_per_market: 0.05      # 5% of bankroll in any single market
  max_total_exposure_pct: 0.40  # 40% of bankroll deployed at once
  daily_loss_limit_pct: 0.05    # halt proposals after -5% on the day
  cooldown_after_consecutive_losses: 3
  cooldown_minutes: 60
  # Global kill switch: halts all proposals and cancels resting orders.
  kill_switch: false

# ---------------------------------------------------------------------------
# Fees & slippage
# Fee math lives in backend/app/core/fees.py and reads data/fee_schedule.yaml.
# Every edge/EV figure in the system is net of these.
# ---------------------------------------------------------------------------
costs:
  # Extra cents of adverse fill assumed on top of book-walk slippage.
  slippage_buffer_cents: 0.5
  # Assume we cross the spread (taker) unless a detector says otherwise.
  assume_taker: true

# ---------------------------------------------------------------------------
# Market-data ingest  (M1)
# ---------------------------------------------------------------------------
ingest:
  # Full depth: orderbook deltas + public tape + ticker.
  #
  # These are every leg of the most liquid mutually-exclusive events, which
  # is exactly what the set-arbitrage detector needs: it prices a whole
  # exhaustive set at once, so a partial set is useless to it. Capped at
  # MAX_FULL_DEPTH_MARKETS (100) in app/ingest/main.py — Kalshi limits
  # markets per subscription.
  #
  # Regenerate by picking the top mutually-exclusive events by 24h volume
  # where every leg is quoted. Currently 65 markets.
  watchlist:
    - KXATPCHALLENGERMATCH-26JUL26MCKFIL-FIL
    - KXATPCHALLENGERMATCH-26JUL26MCKFIL-MCK
    - KXF1CONSTRUCTORS-26-ALP
    - KXF1CONSTRUCTORS-26-AST
    - KXF1CONSTRUCTORS-26-AUD
    - KXF1CONSTRUCTORS-26-CAD
    - KXF1CONSTRUCTORS-26-FER
    - KXF1CONSTRUCTORS-26-HAA
    - KXF1CONSTRUCTORS-26-MCL
    - KXF1CONSTRUCTORS-26-MER
    - KXF1CONSTRUCTORS-26-RAC
    - KXF1CONSTRUCTORS-26-RED
    - KXF1CONSTRUCTORS-26-WIL
    - KXGOVAK-26-ACRU
    - KXGOVAK-26-BWIL
    - KXGOVAK-26-CBIS
    - KXGOVAK-26-EDEV
    - KXGOVAK-26-MPEL
    - KXGOVAK-26-NDAH
    - KXGOVAK-26-TBEG
    - KXGOVAK-26-TTAY
    - KXNEWPOPE-70-AARB
    - KXNEWPOPE-70-FAMB
    - KXNEWPOPE-70-LANT
    - KXNEWPOPE-70-MZUP
    - KXNEWPOPE-70-PERD
    - KXNEWPOPE-70-PPAR
    - KXNEWPOPE-70-PPIZ
    - KXNFLGAME-26AUG13ARILV-ARI
    - KXNFLGAME-26AUG13ARILV-LV
    - KXNFLGAME-26AUG13INDNE-IND
    - KXNFLGAME-26AUG13INDNE-NE
    - KXNFLGAME-26AUG13LACHOU-HOU
    - KXNFLGAME-26AUG13LACHOU-LAC
    - KXNFLGAME-26AUG14DENATL-ATL
    - KXNFLGAME-26AUG14DENATL-DEN
    - KXNFLGAME-26AUG15CARBUF-BUF
    - KXNFLGAME-26AUG15CARBUF-CAR
    - KXNFLGAME-26AUG15DALSEA-DAL
    - KXNFLGAME-26AUG15DALSEA-SEA
    - KXNFLGAME-26AUG15PHIBAL-BAL
    - KXNFLGAME-26AUG15PHIBAL-PHI
    - KXNFLGAME-26SEP09NESEA-NE
    - KXNFLGAME-26SEP09NESEA-SEA
    - KXNFLGAME-26SEP10SFLAR-LAR
    - KXNFLGAME-26SEP10SFLAR-SF
    - KXNFLGAME-26SEP13ARILAC-ARI
    - KXNFLGAME-26SEP13ARILAC-LAC
    - KXNFLGAME-26SEP13CLEJAC-CLE
    - KXNFLGAME-26SEP13CLEJAC-JAC
    - KXNFLGAME-26SEP13TBCIN-CIN
    - KXNFLGAME-26SEP13TBCIN-TB
    - KXTESTMATCH-26JUL251100PAKWI-PAK
    - KXTESTMATCH-26JUL251100PAKWI-TIE
    - KXTESTMATCH-26JUL251100PAKWI-WI
    - KXUFCFIGHT-26AUG01KLEMUS-KLE
    - KXUFCFIGHT-26AUG01KLEMUS-MUS
    - KXUFCFIGHT-26AUG01MEDROD-MED
    - KXUFCFIGHT-26AUG01MEDROD-ROD
    - KXUFCFIGHT-26AUG01REBPRE-PRE
    - KXUFCFIGHT-26AUG01REBPRE-REB
    - KXUFCFIGHT-26AUG01TODVAL-TOD
    - KXUFCFIGHT-26AUG01TODVAL-VAL
    - SENATEIA-26-D
    - SENATEIA-26-R
  # Wider universe gets ticker-level coverage only.
  scanner:
    enabled: true
    max_markets: 500
    # Restrict scanner to these series prefixes; empty = all.
    series_filter: []
  catalog_refresh_sec: 300
  orderbook_snapshot_throttle_ms: 1000
  candle_interval_sec: 60

# ---------------------------------------------------------------------------
# Detectors  (M3-M6)
# ALL DISABLED BY DEFAULT.  Enable one at a time and let the report card
# earn your trust before it earns your money.
# ---------------------------------------------------------------------------
detectors:
  set_arbitrage:
    enabled: false
    min_net_edge_cents: 1.0
    require_full_depth: true       # only signal if every leg fills at quote

    # Series whose markets are collectively EXHAUSTIVE — some leg is certain
    # to resolve YES. Only these get buy-side signals.
    #
    # Kalshi's `mutually_exclusive` flag means "at most one leg resolves YES".
    # That makes SELLING every leg riskless on its own: you collect the sum of
    # the bids and pay out at most $1. It does NOT make BUYING riskless, which
    # needs at least one leg to win — and nothing in the API says that.
    # KXNEWPOPE-70 is exclusive, lists 7 candidates, and their asks sum to
    # $4.12; there are more than 7 possible popes. Buying that set for 99c
    # would lose everything if an eighth won.
    #
    # So this list ships EMPTY and each entry is a claim you are making about
    # the world, not something the exchange told us. Series ticker, no suffix.
    exhaustive_series: []

  stale_quote:
    enabled: false
    min_net_edge_cents: 2.0
    # A reference older than this is not used at all. Comparing a live market
    # to a stale spot invents an edge in whichever direction the market has
    # already moved — the very failure this detector hunts, pointed backwards.
    reference_max_age_sec: 5

    # How far past its strike spot must sit before the outcome is treated as
    # near-decided, and how close to close the market must be.
    #
    # This is a HEURISTIC, not a probability. There is no volatility model
    # behind it yet (that is M6), and Bitcoin moves percent in minutes — so a
    # margin that looks decisive over five minutes is not over thirty. Fair
    # value is also capped below certainty, so the last cents of edge are
    # never manufactured from an assumption of settlement.
    decisive_margin_pct: 1.0
    max_minutes_to_close: 30
    size_hint: 10

  resolution_sniper:
    enabled: false
    # Thresholds apply to the price you would actually PAY — the ask when
    # buying YES — not the mid. A market quoted 96/99 is not a 97c chance.
    yes_threshold_cents: 97
    no_threshold_cents: 3

    # RESEARCH ONLY until a settlement source exists.
    #
    # This detector finds markets past their close time that are still
    # trading at an extreme. That is real settlement lag, and it is NOT an
    # edge on its own: 98c is the crowd's opinion, and buying it because it
    # is high is a 49:1 bet. Being wrong 3% of the time loses money steadily
    # after fees.
    #
    # Signals stay non-actionable until an independent source confirms the
    # outcome. Nothing wires one in yet — reading `settlement_sources` is
    # M7/M8 work — so this emits notes to look at, never proposals.
    min_source_confidence: 0.95

  undervalued_screener:
    enabled: false
    # research feed, not an auto-signal
    max_volume_percentile: 0.25
    min_spread_cents: 2
    max_hours_to_close: 168

  whale_flow:
    enabled: false
    size_zscore_threshold: 3.0
    sweep_window_sec: 2.0
    min_levels_cleared: 2
    base_confidence: 0.35          # flow is an input, never an instruction

  leaderboard_watcher:
    # Experimental / fragile. Official surfaces only — no scraping.
    enabled: false

  longshot_calibration:
    enabled: false
    # Data collection only until this many settled observations exist.
    min_samples_before_signalling: 500
    low_band_cents: [1, 10]
    high_band_cents: [90, 99]

# ---------------------------------------------------------------------------
# Bitcoin engine  (M4/M6)
# ---------------------------------------------------------------------------
bitcoin:
  enabled: false
  spot_source: coinbase          # coinbase | binance | kraken
  ewma_lambda: 0.94
  vol_lookback_minutes: 1440
  min_net_edge_cents: 2.0
  # Optional upgrade: price brackets off Deribit's implied distribution.
  use_deribit_implied: false

# ---------------------------------------------------------------------------
# Weather engine  (M7)
# ---------------------------------------------------------------------------
weather:
  enabled: false
  user_agent: "kalshi-copilot (self-hosted; contact: set-me@example.com)"
  # Station mapping is parsed from each series' rules — never assumed.
  refresh_forecast_sec: 900
  refresh_observations_sec: 300
  min_net_edge_cents: 2.0
  min_calibration_samples: 30

# ---------------------------------------------------------------------------
# News & catalyst engine  (M8)
# ---------------------------------------------------------------------------
news:
  enabled: false
  calendar:
    enabled: false
    sources: [bls, bea, fed]
  headlines:
    enabled: false
    rss_feeds: []
    # Two-tier: cheap triage model on everything, strong model on the hits.
    # Model IDs are resolved at build time against docs.claude.com.
    triage_model: null
    scoring_model: null
    daily_budget_usd: 2.00
    escalation_rate_cap: 0.10    # escalate at most 10% of novel headlines

# ---------------------------------------------------------------------------
# Notifications — first-party only.
# The dashboard is the sole surface: Web Push (PWA), audio ping, favicon badge.
# No Telegram, no ntfy, no third-party push services.
# ---------------------------------------------------------------------------
notifications:
  web_push_enabled: true
  audio_enabled: true
  favicon_badge: true
  # Kill everything above with one flag.
  enabled: true

# ---------------------------------------------------------------------------
# Backtester / paper accounting  (M9)
# ---------------------------------------------------------------------------
backtest:
  # Simulated fills assume we cross the spread and pay taker fees.
  pessimistic_fills: true
  report_card_min_trades: 20
