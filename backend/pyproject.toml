[project]
name = "kalshi-copilot"
version = "0.1.0"
description = "Self-hosted Kalshi analysis and trading copilot (human-in-the-loop)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
    "httpx>=0.28",
    "websockets>=13.1",
    "cryptography>=43.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    # Used by scripts/refresh_fee_schedule.py so the fee schedule can be
    # verified inside the container — no host Python toolchain needed.
    "pypdf>=5.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# --strict-config turns an unrecognised setting above into a hard error rather
# than a silent default. Without it, a missing or renamed `asyncio_mode` makes
# every async test skip quietly — 62 of them here — and the suite still reports
# green. --strict-markers does the same for a mistyped marker. Only the builtin
# `parametrize` is used today, so neither costs anything to switch on.
addopts = "--strict-config --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# Strict on the engine — the parts where a type error costs money.
[[tool.mypy.overrides]]
module = ["app.core.*", "app.config", "app.settings"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true
warn_return_any = true
