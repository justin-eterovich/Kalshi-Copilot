# ============================================================================
# Kalshi fee schedule — data behind backend/app/core/fees.py
#
# SOURCE OF TRUTH:  https://kalshi.com/docs/kalshi-fee-schedule.pdf
#
# Refresh with:
#     python scripts/refresh_fee_schedule.py
#
# Run it from your homelab: kalshi.com sits behind bot protection that blocks
# datacenter IPs.
#
# STRUCTURE NOTE.  Kalshi keys multipliers by SERIES TICKER, not by category.
# There is no category dimension in the schedule at all. An earlier version of
# this file assumed one, which left ~50,000 Crypto markets excluded from
# proposals for a multiplier that does not exist.
# ============================================================================

meta:
  source_url: https://kalshi.com/docs/kalshi-fee-schedule.pdf
  # Date the numbers below were confirmed against the official PDF.
  # null => never verified on this machine.
  verified_on: 2026-07-27
  # The revision string printed on the PDF itself.
  schedule_revision: "Last updated and effective: July 7, 2026"

formula:
  # Taker:  fees = round_up(M * 0.07   * C * P * (1 - P))   M defaults to 1
  # Maker:  fees = round_up(M * 0.0175 * C * P * (1 - P))   M defaults to 0
  #
  # ROUNDING IS TO A CENTICENT ($0.0001), NOT A CENT. The PDF says the fee is
  # rounded up 'such that the fee + positionCost is rounded to a centicent'.
  # Confirmed against the live demo exchange: 2 contracts at $0.20 were billed
  # $0.022400 — 2.24 cents, which cent-rounding would have made $0.03.
  base_taker_rate: 0.07
  base_maker_rate: 0.0175
  rounding_increment_dollars: 0.0001

defaults:
  # 'default is 1 unless otherwise indicated' — the PDF, on the taker M.
  taker_multiplier: 1
  # 'default is 0 unless otherwise indicated' — the PDF, on the maker M.
  # Maker fees are therefore NOT charged unless the series is listed below.
  maker_multiplier: 0

# Every series the PDF lists under 'Non-Standard Fees'. Anything absent uses
# the defaults above. Two shapes appear in practice:
#   maker 1 / taker 1 -> standard taker rate, and maker fees DO apply
#   maker 0 / taker 0 -> no trading fees at all on that series
series:
  KXAAAGASM: {maker: 1, taker: 1}  # US gas price
  KXATPMATCH: {maker: 1, taker: 1}  # ATP Tennis Match
  KXBALLONDOR: {maker: 1, taker: 1}  # Ballon d'Or
