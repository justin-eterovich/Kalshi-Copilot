# ============================================================================
# kalshi-copilot — runtime configuration TEMPLATE
#
#   cp config.example.yaml config.yaml
#
# `config.yaml` is what the stack actually loads, and it is gitignored: it is
# one deployment's state, not the project's defaults.  This file is the
# defaults, it is committed, and `backend/tests/test_config.py` asserts against
# *it* that a fresh clone ships disarmed — every detector off, every engine
# off, paper mode, no autonomy.  Those assertions are the reason the two files
# are separate: while they were one file, enabling a detector on a running box
# edited the thing that was supposed to prove nothing was enabled.
#
# Keep new keys in both.  A key added only to config.yaml is invisible to a
# fresh clone; a key added only here is untested against a real boot.
#
# Bind-mounted read-only into every container.  Most values are editable from
# the settings UI (which writes through to config_kv in Postgres and takes
# precedence over this file); this file is the boot-time default.
#
# Two orthogonal axes decide whether an order happens:
#
#   trading.mode  — WHERE an approved order goes (paper / live).
#   autonomous:   — WHO approved it (a human clicking, or the machine).
#
# Nothing in `trading:` can enable automatic trading; nothing in `autonomous:`
# can change where an order is routed.  Both blocks ship disarmed, and
# `autonomous:` additionally requires an environment interlock this file
# cannot set.
# ============================================================================

# ---------------------------------------------------------------------------
# Trading mode — where an approved order goes
# ---------------------------------------------------------------------------
trading:
  # paper | live
  #   paper : proposals execute against the demo environment / fill simulator
  #   live  : real orders — ALSO requires KALSHI_ENV=prod, LIVE_TRADING=true
  #           in .env, and per-trade confirmation in the UI.
  mode: paper

  # Proposals expire if not approved within this window (seconds).
  default_proposal_ttl_sec: 120

  # In paper mode, send approved orders to the *demo* exchange when demo
  # credentials exist. Demo is play money, so this exercises the real order
  # rail — signing, rate limits, partial fills — at no risk. Set false to fill
  # against the local simulator instead.
  #
  # This can never route to production. Paper mode refuses to touch a prod
  # exchange even if KALSHI_ENV=prod, so changing the environment for a data
  # reason cannot quietly arm real money.
  paper_uses_demo_exchange: true

  # Order placed on approval.
  order:
    # gtc | ioc
    time_in_force: gtc
    # Cancel an unfilled (or partially filled) order after this many seconds.
    auto_cancel_after_sec: 90
    # Never pay worse than the proposed price.
    allow_price_improvement_only: true

# ---------------------------------------------------------------------------
# Autonomous trading — who approves
#
# When armed, the worker approves and places proposals with no human click.
# This is real and it can reach real money.  Read the "Autonomy" section of
# CLAUDE.md before changing anything here.
#
# Arming the machine takes four separate facts, and this file holds two of
# them:
#     enabled: true            (here)
#     routes.<rail>: true      (here)
#     AUTONOMOUS_TRADING=true  (.env — plus KALSHI_ENV/LIVE_TRADING for live)
# and then, per trade, the evidence gate and the budget below.
#
# The evidence gate is what replaces the human's judgement.  It refuses
# unless the backtest report card has *measured* a positive edge for that
# detector on that route.  On this deployment's data it refuses everything
# today, and that is the gate working, not a bug — see `docker compose run
# --rm --no-deps api python scripts/backtest.py --days 30`.
# ---------------------------------------------------------------------------
autonomous:
  enabled: false

  # Which rails the machine may fire on.  Independent of trading.mode: the
  # route is resolved as always, and this only says whether the machine is
  # allowed to act once it is.
  routes:
    simulated: false        # local fill simulator; no API call leaves the box
    demo_exchange: false    # real order rail, play money
    live_exchange: false    # REAL MONEY. Needs all three env vars as well.

  # What the machine must be able to prove.  None of this is waivable while
  # an exchange route is armed; the loader refuses such a config at boot.
  evidence:
    # Refuse unless the report card's bootstrap CI lower bound is above zero
    # for this (detector, route).  Not the mean — a 20-trade binary sample is
    # exactly the regime where a point estimate lies.
    require_edge_shown: true
    # Refuse unless the backtest coverage gate passes.  May only be false
    # while just `simulated` is armed (bring-up).
    require_coverage_usable: true
    # Blank = use backtest.report_card_min_trades.  May only be raised.
    min_trades: null
    # An evidence snapshot older than this is refused rather than used.
    max_report_age_sec: 900

  # Ceilings.  EVERY ONE OF THESE DEFAULTS TO ZERO AND ZERO REFUSES.
  # There is no way to write "unlimited" here, deliberately.
  budget:
    max_trades_per_hour: 0
    max_trades_per_detector_per_hour: 0
    # Sum of max_loss_cents over autonomous approvals in the UTC day.
    max_daily_risk_cents: 0
    # Open markets on the route, from any source (not just autonomous ones).
    max_open_positions: 0
    # Working orders on the route before autonomy stops adding.  1 means
    # "place one, let it resolve, then consider the next".
    max_working_orders: 1
    # After an autonomous trade, refuse the same detector on the same ticker
    # for this long.  Without it the detector re-derives the same edge every
    # scan and the duplicate guard has already cleared — see CLAUDE.md.
    repeat_cooldown_sec: 3600

  # How often the machine looks at the queue.
  decision_interval_sec: 10
  # A proposal must be this old before the machine may act on it.  This is
  # the operator's veto window; the dashboard counts it down.
  min_proposal_age_sec: 15

  # Self-disarm.  A latch, not a cooldown: it does not clear on its own.
  disarm_after_consecutive_losses: 3
  disarm_after_failed_placements: 3
  disarm_on_verdict_degradation: true
  require_manual_rearm: true

# ---------------------------------------------------------------------------
# Risk & sizing  (M7)
# ---------------------------------------------------------------------------
risk:
  bankroll_usd: 1000.0
  # Hard ceiling on proposals awaiting a decision. The safety model is a
  # human reading each one; a detector scanning every 20s can fill a queue
  # faster than anyone reads it, and a queue that long is rubber-stamped
  # rather than reviewed. Approval fatigue is a failure no test catches.
  max_pending_proposals: 10
  kelly_fraction: 0.25          # quarter-Kelly
  max_pct_per_market: 0.05      # 5% of bankroll in any single market
  max_total_exposure_pct: 0.40  # 40% of bankroll deployed at once
  daily_loss_limit_pct: 0.05    # halt proposals after -5% on the day
  cooldown_after_consecutive_losses: 3
  cooldown_minutes: 60
  # Global kill switch: halts all proposals and cancels resting orders.
  kill_switch: false

# ---------------------------------------------------------------------------
# Fees & slippage
# Fee math lives in backend/app/core/fees.py and reads data/fee_schedule.yaml.
# Every edge/EV figure in the system is net of these.
# ---------------------------------------------------------------------------
costs:
  # Extra cents of adverse fill assumed on top of book-walk slippage.
  slippage_buffer_cents: 0.5
  # Assume we cross the spread (taker) unless a detector says otherwise.
  assume_taker: true

# ---------------------------------------------------------------------------
# Market-data ingest  (M1)
# ---------------------------------------------------------------------------
ingest:
  # Full depth: orderbook deltas + public tape + ticker.
  #
  # These are every leg of the most liquid mutually-exclusive events, which
  # is exactly what the set-arbitrage detector needs: it prices a whole
  # exhaustive set at once, so a partial set is useless to it. Capped at
  # MAX_FULL_DEPTH_MARKETS (100) in app/ingest/main.py — Kalshi limits
  # markets per subscription.
  #
  # Regenerate by picking the top mutually-exclusive events by 24h volume
  # where every leg is quoted. Currently 65 markets.
  watchlist:
    - KXATPCHALLENGERMATCH-26JUL26MCKFIL-FIL
    - KXATPCHALLENGERMATCH-26JUL26MCKFIL-MCK
    - KXF1CONSTRUCTORS-26-ALP
    - KXF1CONSTRUCTORS-26-AST
    - KXF1CONSTRUCTORS-26-AUD
    - KXF1CONSTRUCTORS-26-CAD
    - KXF1CONSTRUCTORS-26-FER
    - KXF1CONSTRUCTORS-26-HAA
    - KXF1CONSTRUCTORS-26-MCL
    - KXF1CONSTRUCTORS-26-MER
    - KXF1CONSTRUCTORS-26-RAC
    - KXF1CONSTRUCTORS-26-RED
    - KXF1CONSTRUCTORS-26-WIL
    - KXGOVAK-26-ACRU
    - KXGOVAK-26-BWIL
    - KXGOVAK-26-CBIS
    - KXGOVAK-26-EDEV
    - KXGOVAK-26-MPEL
    - KXGOVAK-26-NDAH
    - KXGOVAK-26-TBEG
    - KXGOVAK-26-TTAY
    - KXNEWPOPE-70-AARB
    - KXNEWPOPE-70-FAMB
    - KXNEWPOPE-70-LANT
    - KXNEWPOPE-70-MZUP
    - KXNEWPOPE-70-PERD
    - KXNEWPOPE-70-PPAR
    - KXNEWPOPE-70-PPIZ
    - KXNFLGAME-26AUG13ARILV-ARI
    - KXNFLGAME-26AUG13ARILV-LV
    - KXNFLGAME-26AUG13INDNE-IND
    - KXNFLGAME-26AUG13INDNE-NE
    - KXNFLGAME-26AUG13LACHOU-HOU
    - KXNFLGAME-26AUG13LACHOU-LAC
    - KXNFLGAME-26AUG14DENATL-ATL
    - KXNFLGAME-26AUG14DENATL-DEN
    - KXNFLGAME-26AUG15CARBUF-BUF
    - KXNFLGAME-26AUG15CARBUF-CAR
    - KXNFLGAME-26AUG15DALSEA-DAL
    - KXNFLGAME-26AUG15DALSEA-SEA
    - KXNFLGAME-26AUG15PHIBAL-BAL
    - KXNFLGAME-26AUG15PHIBAL-PHI
    - KXNFLGAME-26SEP09NESEA-NE
    - KXNFLGAME-26SEP09NESEA-SEA
    - KXNFLGAME-26SEP10SFLAR-LAR
    - KXNFLGAME-26SEP10SFLAR-SF
    - KXNFLGAME-26SEP13ARILAC-ARI
    - KXNFLGAME-26SEP13ARILAC-LAC
    - KXNFLGAME-26SEP13CLEJAC-CLE
    - KXNFLGAME-26SEP13CLEJAC-JAC
    - KXNFLGAME-26SEP13TBCIN-CIN
    - KXNFLGAME-26SEP13TBCIN-TB
    - KXTESTMATCH-26JUL251100PAKWI-PAK
    - KXTESTMATCH-26JUL251100PAKWI-TIE
    - KXTESTMATCH-26JUL251100PAKWI-WI
    - KXUFCFIGHT-26AUG01KLEMUS-KLE
    - KXUFCFIGHT-26AUG01KLEMUS-MUS
    - KXUFCFIGHT-26AUG01MEDROD-MED
    - KXUFCFIGHT-26AUG01MEDROD-ROD
    - KXUFCFIGHT-26AUG01REBPRE-PRE
    - KXUFCFIGHT-26AUG01REBPRE-REB
    - KXUFCFIGHT-26AUG01TODVAL-TOD
    - KXUFCFIGHT-26AUG01TODVAL-VAL
    - SENATEIA-26-D
    - SENATEIA-26-R
  # Wider universe gets ticker-level coverage only.
  scanner:
    enabled: true
    max_markets: 500
    # Restrict scanner to these series prefixes; empty = all.
    series_filter: []
  catalog_refresh_sec: 300
  orderbook_snapshot_throttle_ms: 1000
  candle_interval_sec: 60

# ---------------------------------------------------------------------------
# Detectors  (M3-M6)
# ALL DISABLED BY DEFAULT.  Enable one at a time and let the report card
# earn your trust before it earns your money.
# ---------------------------------------------------------------------------
detectors:
  # A detector re-derives the same opportunity on every scan. Within this
  # window an identical observation bumps a counter on the existing signal
  # instead of writing another row — the undervalued screener produced 180
  # near-identical rows in nine passes, and a signals table nobody reads is
  # the approval-fatigue failure one step earlier. Set 0 to disable folding.
  dedupe_window_sec: 900
  # ...unless the edge has actually moved this far, which makes it news
  # rather than a repeat.
  dedupe_edge_change_cents: 1.0

  set_arbitrage:
    enabled: false
    min_net_edge_cents: 1.0
    # NOT IMPLEMENTED — read by nothing. Set-arb already requires full depth
    # on every leg unconditionally; wiring this as a toggle would let a set
    # be priced from partial coverage, and a set priced from partial
    # coverage is not a set. Left here as a note, not a tunable.
    # require_full_depth: true

    # Series whose markets are collectively EXHAUSTIVE — some leg is certain
    # to resolve YES. Only these get buy-side signals.
    #
    # Kalshi's `mutually_exclusive` flag means "at most one leg resolves YES".
    # That makes SELLING every leg riskless on its own: you collect the sum of
    # the bids and pay out at most $1. It does NOT make BUYING riskless, which
    # needs at least one leg to win — and nothing in the API says that.
    # KXNEWPOPE-70 is exclusive, lists 7 candidates, and their asks sum to
    # $4.12; there are more than 7 possible popes. Buying that set for 99c
    # would lose everything if an eighth won.
    #
    # So this list ships EMPTY and each entry is a claim you are making about
    # the world, not something the exchange told us. Series ticker, no suffix.
    exhaustive_series: []

  stale_quote:
    enabled: false
    min_net_edge_cents: 2.0
    # A reference older than this is not used at all. Comparing a live market
    # to a stale spot invents an edge in whichever direction the market has
    # already moved — the very failure this detector hunts, pointed backwards.
    reference_max_age_sec: 5

    # How far past its strike spot must sit before the outcome is treated as
    # near-decided, and how close to close the market must be.
    #
    # This is a HEURISTIC, not a probability. There is no volatility model
    # behind it yet (that is M6), and Bitcoin moves percent in minutes — so a
    # margin that looks decisive over five minutes is not over thirty. Fair
    # value is also capped below certainty, so the last cents of edge are
    # never manufactured from an assumption of settlement.
    decisive_margin_pct: 1.0
    max_minutes_to_close: 30
    size_hint: 10

  resolution_sniper:
    enabled: false
    # Thresholds apply to the price you would actually PAY — the ask when
    # buying YES — not the mid. A market quoted 96/99 is not a 97c chance.
    yes_threshold_cents: 97
    no_threshold_cents: 3

    # RESEARCH ONLY until a settlement source exists.
    #
    # This detector finds markets past their close time that are still
    # trading at an extreme. That is real settlement lag, and it is NOT an
    # edge on its own: 98c is the crowd's opinion, and buying it because it
    # is high is a 49:1 bet. Being wrong 3% of the time loses money steadily
    # after fees.
    #
    # Signals stay non-actionable until an independent source confirms the
    # outcome. Nothing wires one in yet — reading `settlement_sources` is
    # M7/M8 work — so this emits notes to look at, never proposals.
    # NOT IMPLEMENTED — read by nothing, and a placeholder for a settlement
    # source that does not exist. The sniper stays research-only until one
    # does; this value would not change that.
    # min_source_confidence: 0.95

  undervalued_screener:
    enabled: false
    # research feed, not an auto-signal
    max_volume_percentile: 0.25
    min_spread_cents: 2
    max_hours_to_close: 168
    # The screener is a ranking, so its tail is noise by construction —
    # without a cap it would bury every other detector's signals under
    # hundreds of "this market is quiet" notes.
    max_results: 20

  whale_flow:
    enabled: false
    size_zscore_threshold: 3.0
    sweep_window_sec: 2.0
    min_levels_cleared: 2
    base_confidence: 0.35          # flow is an input, never an instruction
    lookback_minutes: 30           # how much tape each scan reads

  leaderboard_watcher:
    # NOT IMPLEMENTED, and not merely unfinished — there is nothing to build
    # against. Kalshi's OpenAPI spec exposes no leaderboard, no public trader
    # ranking, and no public profile surface of any kind; the only endpoints
    # naming a counterparty are RFQ and block-trade negotiation, which are
    # yours alone. Checked against docs.kalshi.com/openapi.yaml on 2026-07-27.
    #
    # The only way to build this is to scrape the web app, which this project
    # does not do. Setting `enabled: true` logs a refusal explaining that and
    # emits nothing — a silent no-op would look like a working detector that
    # never finds anything, which is the worse failure.
    enabled: false

  longshot_calibration:
    enabled: false
    # Data collection only until this many settled observations exist.
    min_samples_before_signalling: 500
    low_band_cents: [1, 10]
    high_band_cents: [90, 99]

# ---------------------------------------------------------------------------
# Bitcoin engine  (M4/M6)
# ---------------------------------------------------------------------------
bitcoin:
  # `stale_quote` depends on this: the spot poller is what writes the
  # ExternalPrice rows the detector prices against, and with no reference it
  # refuses on every scan rather than guessing. Turning stale_quote on while
  # this is off yields a detector that runs and can never signal — so enable
  # the pair together, or neither.
  enabled: false
  spot_source: coinbase          # coinbase | binance | kraken

  # Which reference prices to poll. `stale_quote` maps a market's SERIES to one
  # of these symbols and refuses outright when the feed is absent, so a symbol
  # left out here is not a smaller universe — it is a slice of the catalog the
  # detector can see and can never price. Measured before this list existed and
  # only BTC was polled: 1,353 of the 1,730 markets the detector selected were
  # ETH/SOL/XRP, and all 1,353 were dropped for want of a reference.
  #
  # Each symbol is an independent HTTP GET on every poll tick, fanned out
  # concurrently. Empty is rejected at load — use `enabled: false` to turn the
  # feed off, so that "no spot feed" cannot be spelled two different ways.
  spot_symbols: [BTC-USD, ETH-USD, SOL-USD, XRP-USD]

  ewma_lambda: 0.94
  vol_lookback_minutes: 1440
  min_net_edge_cents: 2.0
  # NOT IMPLEMENTED — read by nothing. Pricing brackets off Deribit's implied
  # distribution would be a real upgrade; this flag is not it.
  # use_deribit_implied: false

# ---------------------------------------------------------------------------
# Weather engine  (M7)
# ---------------------------------------------------------------------------
weather:
  enabled: false
  user_agent: "kalshi-copilot (self-hosted; contact: set-me@example.com)"
  # Station mapping is parsed from each series' rules — never assumed.
  refresh_forecast_sec: 900
  refresh_observations_sec: 300
  min_net_edge_cents: 2.0
  min_calibration_samples: 30

# ---------------------------------------------------------------------------
# News & catalyst engine  (M8)
# ---------------------------------------------------------------------------
news:
  enabled: false
  # BLS and SEC serve an HTML "Access Denied" page with HTTP 200 to
  # unrecognised agents — a failure that looks like an empty feed rather than
  # an error. Identify properly, with a contact.
  user_agent: "kalshi-copilot (self-hosted; contact: set-me@example.com)"
  calendar:
    enabled: false
    sources: [bls, bea, fed]
  headlines:
    enabled: false
    # Ships empty. Each feed is a decision about what this system reads, and
    # a wide feed is not a better one: relevance matching is precision-first
    # and an unmatched headline is the expected outcome for almost all world
    # news, so a general newswire mostly buys noise. Official sources whose
    # releases actually settle Kalshi markets are the useful ones.
    rss_feeds: []
    #   - {source: fed, url: "https://www.federalreserve.gov/feeds/press_all.xml"}
    #   - {source: bls, url: "https://www.bls.gov/feed/bls_latest.rss"}

    # Two-tier: cheap triage on every novel headline, strong model only on the
    # hits. Haiku is roughly an order of magnitude cheaper than Sonnet, which
    # is what makes reading everything affordable at all.
    triage_model: claude-haiku-4-5-20251001
    scoring_model: claude-sonnet-5

    # Two independent limits that fail differently. The budget caps the money.
    # The escalation cap catches triage *breaking*: if it starts escalating
    # everything, that is a regression, and stopping beats spending the day's
    # budget in ten minutes and calling it working.
    daily_budget_usd: 2.00
    escalation_rate_cap: 0.10    # escalate at most 10% of novel headlines

# ---------------------------------------------------------------------------
# Notifications — first-party only.
# The dashboard is the sole surface: Web Push (PWA), audio ping, favicon badge.
# No Telegram, no ntfy, no third-party push services.
# ---------------------------------------------------------------------------
notifications:
  # OFF, and not merely unimplemented: the Push API and service workers
  # require a *secure context*, and this dashboard is served over plain HTTP
  # on a LAN address by design. Turning this on cannot work until the
  # dashboard has TLS (a self-signed cert, or a local CA installed on each
  # device), which is an operator decision — see docs/m5-demo-notes.md.
  # Everything below works today and needs no permission prompt, but only
  # while a tab is open.
  web_push_enabled: false
  audio_enabled: true
  favicon_badge: true
  # Kill everything above with one flag.
  enabled: true

# ---------------------------------------------------------------------------
# Backtester / paper accounting  (M9)
# ---------------------------------------------------------------------------
backtest:
  # NOT IMPLEMENTED — read by nothing. The backtester always fills through
  # `app/trading/paper.py`, the same pessimistic simulator live paper trading
  # uses. A flag implying a friendlier alternative exists would be a lie, and
  # a friendlier one is exactly what a backtest must not have.
  # pessimistic_fills: true
  report_card_min_trades: 20
